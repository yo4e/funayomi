[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "funayomi"
version = "0.1.0"
description = "芦屋ボートレース3連単の説明可能な期待値ランキング・コア"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "FunaYomi contributors"},
]
dependencies = []

[project.scripts]
funayomi = "funayomi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
